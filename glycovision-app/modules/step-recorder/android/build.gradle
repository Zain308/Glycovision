plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.glycovision.steprecorder'
version = '1.0.0'

android {
  namespace "com.glycovision.steprecorder"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation 'com.google.android.gms:play-services-fitness:21.2.0'
}
